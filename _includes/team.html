<!-- Team Section -->
    <section id="team" class="bg-darkest-gray">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2 class="section-heading">Team</h2>
                </div>
            </div>
            <div class="row">
                {% for member in site.people %}
                <div class="col-sm-6">
                    <div class="team-member">
                        {% assign portrait = '/img/team/' | append: member.pic | append: '.jpg' %}
                        <img src="{{ portrait | asset_url }}" width="800" height="800" loading="lazy" decoding="async" class="img-responsive img-circle" alt="{{ member.name | escape }}">
                        <h4>{{ member.name }}</h4>
                        <p>{{ member.position }}</p>
                        {% for paragraph in member.description %}
                          <p class='bio'>{{ paragraph.text }}</p>
                        {% endfor %}
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </section>
